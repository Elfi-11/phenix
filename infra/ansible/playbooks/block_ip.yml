# Action : bloquer une adresse IP dans nginx
# Usage  : bash infra/ansible/run.sh block_ip ip=203.0.113.5 [minutes=60] [reason=bruteforce]
# Sans minutes : bloquée jusqu'à unblock_ip (décision d'un admin). Avec minutes : expire seule (max : max_block_minutes).
# Motif : lettres, chiffres, _ . : - seulement (pas d'espace). Les adresses de never_block ne sont jamais bloquées.
- name: Bloquer une adresse IP
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Contrôle des paramètres
      ansible.builtin.assert:
        that:
          - ip is defined
          - (ip | string) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - (minutes | default(0) | string) is match('^[0-9]{1,5}$')
          - (minutes | default(0) | int) <= max_block_minutes
          - (reason | default('remediation') | string) is match('^[A-Za-z0-9_.:-]{0,60}$')
        fail_msg: "Paramètres invalides. Attendu : ip=A.B.C.D [minutes=0..{{ max_block_minutes }}] [reason=motif-sans-espace]"
        quiet: true

    - name: Appliquer le blocage
      ansible.builtin.include_tasks: ../tasks/blocklist_apply.yml
      vars:
        bl_args: "{{ ['add', '--ip', ip | string, '--minutes', (minutes | default(0)) | string, '--reason', (reason | default('remediation')) | string] + (never_block | map('regex_replace', '^', '--protect=') | list) }}"
