# Journal d'accès en JSON (lu par Promtail, filtrable dans Grafana avec "| json")
# src_ip = IP réelle du client (rétablie par real_ip ci-dessous, pas l'IP du WAF)
log_format json_combined escape=json
  '{"time":"$time_iso8601","src_ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';

server {
    listen 80;

    # Ne pas afficher la version de Nginx dans les en-têtes et pages d'erreur
    server_tokens off;

    # L'API ne reçoit que du JSON (login, paiements) : pas besoin de gros envois
    client_max_body_size 1m;

    # Tout le trafic arrive par le WAF : on lui fait confiance pour donner l'IP réelle du client.
    # Sans ça, $remote_addr = IP du WAF → logs inutiles et la blocklist bloquerait tout le monde.
    # Le WAF n'est joignable que par le réseau Docker (plage privée 172.16.0.0/12).
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    # Ignorer les adresses de confiance en partant de la droite : retient l'IP du client, pas celle du WAF
    real_ip_recursive on;

    # Noms resolus a chaque requete via le DNS interne de Docker : plus de 502 apres un redemarrage
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_up http://frontend:80;
    set $backend_up  http://backend:8000;

    access_log /dev/stdout json_combined;

    # En-têtes de sécurité envoyés au navigateur
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Adresses bloquées par la remédiation (dossier monté, un fichier .conf avec des lignes "deny x.x.x.x;")
    include /etc/nginx/blocklist/*.conf;

    # Contrôle de santé de nginx lui-même
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Frontend (fichiers statiques React)
    location / {
        proxy_pass $frontend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API : une requête de paiement doit répondre vite, on coupe au-delà de 30 s
    location /api/ {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Swagger UI (pratique en démo ; à retirer pour un vrai déploiement)
    location /docs {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger JSON
    location /openapi.json {
        proxy_pass $backend_up;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check de l'API
    location /health {
        access_log off;
        proxy_pass $backend_up;
        proxy_set_header Host $host;
    }
}
