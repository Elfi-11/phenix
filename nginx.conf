# Journal d'accès en JSON (lu par Promtail, filtrable dans Grafana avec "| json")
log_format json_combined escape=json
  '{"time":"$time_iso8601","src_ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"request_time":$request_time,"request_id":"$request_id","ua":"$http_user_agent"}';

server {
    listen 80;
    client_max_body_size 200M;

    access_log /dev/stdout json_combined;

    # Adresses bloquées par la remédiation (dossier monté, un fichier .conf avec des lignes "deny x.x.x.x;")
    include /etc/nginx/blocklist/*.conf;

    # Contrôle de santé de nginx lui-même
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend API (timeout 5 min pour import pivot / traitements lourds, sans être excessif)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Swagger UI
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Swagger JSON
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check de l'API
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
