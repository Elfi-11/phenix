services:
  frontend:
    security_opt:
      - no-new-privileges:true
    build:
      context: ./frontend
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      - TZ=UTC
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - app
      - data
      - assistant
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/blocklist:/etc/nginx/blocklist:ro
    depends_on:
      - frontend
      - backend
    security_opt:
      - no-new-privileges:true
    networks:
      - dmz
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
  waf:
    image: owasp/modsecurity-crs:4.24.1-nginx-202603150103
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped
    environment:
      BACKEND: http://nginx:80
      PORT: 8080
      PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      MODSEC_RULE_ENGINE: "DetectionOnly"
      MODSEC_AUDIT_LOG_FORMAT: JSON
      MODSEC_AUDIT_LOG: /var/log/modsecurity/audit.log
    volumes:
      - waf_logs:/var/log/modsecurity
    depends_on:
      nginx:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - dmz

  db:
    image: postgres:14
    expose:
      - "5432"
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      - TZ=UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    security_opt:
      - no-new-privileges:true
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  pg_dump:
    security_opt:
      - no-new-privileges:true
    image: postgres:14
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          F=/backups/dump_$$(date +%Y%m%d_%H%M%S).sql
          if PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -h db -U "$$POSTGRES_USER" \
              --clean --if-exists "$$POSTGRES_DB" > "$$F.tmp"; then
            mv "$$F.tmp" "$$F"
            cp "$$F" /backups/latest.sql
          else
            rm -f "$$F.tmp"
          fi
          ls -1t /backups/dump_*.sql 2>/dev/null | tail -n +13 | xargs -r rm -f
          sleep 300
        done
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  pgadmin:
    image: dpage/pgadmin4:9.16
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5050:80"
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: "UTC"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - data
      - dev

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    networks:
      - ops
      - app

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    security_opt:
      - no-new-privileges:true
    networks:
      - ops

  # Seul conteneur qui touche docker.sock : il n'autorise que la lecture des conteneurs
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    networks:
      - ops

  promtail:
    image: grafana/promtail:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/observability/promtail.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/positions
    depends_on:
      - docker-proxy
      - loki
    security_opt:
      - no-new-privileges:true
    networks:
      - ops

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ops

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    networks:
      - ops

  # Assistant documentaire local : aucun accès aux réseaux métier ou aux secrets.
  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ollama_models:/root/.ollama
    security_opt:
      - no-new-privileges:true
    networks:
      - rag
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Téléchargement ponctuel : serveur temporaire, sans corpus ni réseau du RAG.
  ollama-init:
    image: ollama/ollama:0.11.10
    restart: "no"
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        ollama serve &
        server_pid=$$!
        cleanup() {
          kill "$$server_pid" 2>/dev/null || true
          wait "$$server_pid" 2>/dev/null || true
        }
        trap cleanup EXIT
        trap 'exit 1' INT TERM
        attempt=0
        until ollama list >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            echo "Erreur : serveur temporaire Ollama indisponible" >&2
            exit 1
          fi
          sleep 1
        done
        for model in embeddinggemma:300m qwen3:4b-instruct; do
          if ollama show "$$model" >/dev/null 2>&1; then
            echo "Modele deja disponible : $$model"
          else
            echo "Telechargement : $$model"
            ollama pull "$$model"
          fi
        done
    security_opt:
      - no-new-privileges:true
    networks:
      - model_download

  rag:
    build:
      context: ./backend/ML
    environment:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      RAG_CHAT_MODEL: qwen3:4b-instruct
      RAG_EMBEDDING_MODEL: embeddinggemma:300m
      RAG_CORPUS_DIR: /workspace/corpus
      RAG_INDEX_PATH: /workspace/data/index.json
    volumes:
      - ./backend/ML/corpus:/workspace/corpus:ro
      - rag_index:/workspace/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    # Serveur HTTP de l'assistant (POST /ask sur le port 8000), appelé uniquement par le backend
    command: ["python", "-m", "rag.server"]
    restart: unless-stopped
    expose:
      - "8000"
    networks:
      - rag
      - assistant

volumes:
  # Volumes gérés par Compose : modèles préparés par ollama-init, indexation manuelle.
  ollama_models:
  rag_index:
  postgres-data:
  pgadmin-data:
  prometheus-data:
  loki-data:
  grafana-data:
  promtail-positions:
  waf_logs:

networks:
  # Réseau d'inférence isolé de la connectivité externe.
  rag:
    internal: true
  # Backend <-> assistant uniquement : le RAG ne voit ni la base, ni le front, ni la supervision
  assistant:
    internal: true
  # Seul le téléchargeur ponctuel utilise ce réseau avec accès externe.
  model_download: {}
  dmz: {}
  app:
    internal: true
  data:
    internal: true
  ops: {}
  dev: {}